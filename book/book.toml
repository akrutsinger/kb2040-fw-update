[book]
title = "kb2040-fw-update"
authors = ["Austyn Krutsinger"]
description = "Encrypted firmware updates for the Adafruit KB2040, step by step"
language = "en"

[output.html]
site-url = "/kb2040-fw-update/"
git-repository-url = "https://github.com/akrutsinger/kb2040-fw-update"
