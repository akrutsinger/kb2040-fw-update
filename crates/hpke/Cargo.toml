[package]
name = "hpke"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HPKE (RFC 9180) open, for DHKEM(P-256, HKDF-SHA256), HKDF-SHA256 and AES-128-GCM, with the Diffie-Hellman step left to the caller"

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes"] }
hkdf = "0.13"
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
p256 = { version = "0.13", default-features = false, features = ["ecdh"] }
