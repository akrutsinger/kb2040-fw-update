# Builds the mdBook in book/ and publishes it to GitHub Pages.
name: Book

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.4
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf -y | sh
          rustup update
          cargo install --version ${MDBOOK_VERSION} mdbook
      # mdBook includes a missing anchor as an empty snippet, without an error.
      - name: Check snippet anchors
        working-directory: book/src
        run: |
          grep -ohE '\{\{#include [^}:]+:[A-Za-z_-]+\}\}' *.md |
            sed -E 's/\{\{#include (.+):(.+)\}\}/\1 \2/' | sort -u |
            while read -r file anchor; do
              grep -qE "ANCHOR: $anchor( |\$)" "$file" || { echo "$file has no anchor '$anchor'"; exit 1; }
            done
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with mdBook
        run: mdbook build book
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
