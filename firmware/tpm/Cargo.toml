[package]
name = "tpm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Async driver for TPM 2.0 chips on SPI (tested with the Infineon SLB 9670)"

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"
bitflags = "2.9"
tpm2-protocol = "1.2.3"

# Host-only: run with `cargo test -p tpm --target x86_64-unknown-linux-gnu` (see README).
[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1", "embedded-hal-async"] }
tokio = { version = "1", features = ["rt", "macros"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
