[package]
name = "app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "app"
test = false
bench = false

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time = "0.5.1"
cortex-m-rt = "0.7"
smart-leds = "0.4.0"
panic-halt = "1.0.0"
embassy-usb = { version = "0.6.0", default-features = false }
static_cell = "2.1.1"
cortex-m = "0.7.9"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
embassy-boot-rp = "0.10.0"
embassy-boot = { version = "0.7.0", features = ["ed25519-salty"] }
embassy-sync = "0.8.0"
embedded-storage = "0.3.2"
heapless = "0.9.3"
tpm = { path = "../tpm" }
sha2 = { version = "0.11.1", default-features = false }
hpke = { path = "../hpke" }
aes = "0.9.3"
ctr = "0.10.1"

[build-dependencies]
base64 = "0.22.1"
