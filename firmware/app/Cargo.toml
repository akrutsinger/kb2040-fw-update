[package]
name = "app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "app"
test = false
bench = false

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time = "0.5.1"
cortex-m-rt = "0.7"
smart-leds = "0.4.0"
panic-halt = "1.0.0"
